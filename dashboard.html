<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoU Helper — Dashboard</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <header class="app">
    <img src="icons/icon48.png" alt="">
    <h1>LoU Revival Helper <span class="ver" id="ver"></span></h1>
    <nav class="tabs">
      <a href="#kota" data-view="kota">🏰 Ringkasan Kota</a>
      <a href="#layout" data-view="layout">📐 Perencana Layout</a>
      <a href="#gerak" data-view="gerak">🚩 Pergerakan <span class="nav-badge hide" id="nav-inc"></span></a>
      <a href="#dungeon" data-view="dungeon">⚔️ Dungeon &amp; Boss</a>
      <a href="#pengaturan" data-view="pengaturan">⚙️ Pengaturan</a>
      <a href="#cheat" data-view="cheat">📜 Cheat Sheet</a>
      <a href="#tentang" data-view="tentang">ℹ️ Tentang</a>
    </nav>
    <span class="grow"></span>
    <span class="small muted row" id="live"><span class="status-dot"></span><span>—</span></span>
  </header>

  <main>
    <section class="view" id="view-kota"></section>
    <section class="view" id="view-layout"></section>
    <section class="view" id="view-gerak"></section>
    <section class="view" id="view-dungeon"></section>
    <section class="view" id="view-pengaturan"></section>
    <section class="view" id="view-cheat"></section>
    <section class="view" id="view-tentang"></section>
  </main>

  <footer class="app-foot small muted">LoU Revival Helper · dibuat oleh <a href="#tentang">ardhie</a> · <a href="mailto:ardhie.andro@gmail.com">ardhie.andro@gmail.com</a></footer>
  <div class="toast" id="toast"></div>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
