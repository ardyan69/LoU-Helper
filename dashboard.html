<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoU Helper — Dashboard</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <header class="app">
    <img src="icons/icon48.png" alt="">
    <h1>LoU Revival Helper <span class="ver" id="ver"></span></h1>
    <nav class="tabs" aria-label="Menu"><a href="#kota" data-view="kota">🏰</a><span class="nav-badge hide" id="nav-inc"></span></nav>
    <span class="grow"></span>
    <button class="btn sm nav-search" id="nav-search" type="button">🔎 <kbd>Ctrl K</kbd></button>
    <span class="small muted num" id="srv-clock"></span>
    <span class="small muted row" id="live"><span class="status-dot"></span><span>—</span></span>
  </header>

  <main>
    <section class="view" id="view-kota"></section>
    <section class="view" id="view-todo"></section>
    <section class="view" id="view-timeline"></section>
    <section class="view" id="view-layout"></section>
    <section class="view" id="view-gerak"></section>
    <section class="view" id="view-operasi"></section>
    <section class="view" id="view-menteri"></section>
    <section class="view" id="view-dungeon"></section>
    <section class="view" id="view-statistik"></section>
    <section class="view" id="view-pemain"></section>
    <section class="view" id="view-pengaturan"></section>
    <section class="view" id="view-cheat"></section>
    <section class="view" id="view-tentang"></section>
  </main>

  <footer class="app-foot small muted">LoU Revival Helper · dibuat oleh <a href="#tentang">ardhie</a> · <a href="mailto:ardhie.andro@gmail.com">ardhie.andro@gmail.com</a></footer>
  <div class="toast" id="toast"></div>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
