<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="dashboard.css">
  <style>
    body { width: 360px; }
    .wrap { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .top { display: flex; align-items: center; gap: 8px; }
    .top img { width: 24px; height: 24px; }
    .top h1 { font-size: 15px; color: var(--gold-2); }
    .p-list { display: flex; flex-direction: column; align-items: stretch; gap: 6px; max-height: 360px; overflow: auto; }
    .mc { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; }
    .mc b { font-size: 13px; }
    .mc .row { justify-content: space-between; }
    .btns { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; }
    .alert { background: #4a1d16; border: 1px solid var(--bad); border-radius: 8px; padding: 8px 10px; font-size: 12px; }
    .mvline { font-size: 12px; color: var(--muted); }
    .btns .btn { text-align: center; font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top"><img src="icons/icon48.png" alt=""><h1>LoU Helper</h1><span class="grow"></span><span class="small muted" id="p-live"></span></div>
    <div id="p-perm"></div>
    <div id="p-alert"></div>
    <div class="p-list" id="p-list"></div>
    <div class="mvline" id="p-mv"></div>
    <div class="btns">
      <button class="btn" data-open="kota">🏰 Kota</button>
      <button class="btn" data-open="layout">📐 Layout</button>
      <button class="btn" data-open="gerak">🚩 Gerak</button>
      <button class="btn" data-open="dungeon">⚔️ Dungeon</button>
    </div>
    <button class="btn primary" data-open="game">Buka game</button>
    <div class="small muted" style="text-align:center"><span id="p-ver"></span> · by <a href="#" data-open="tentang">ardhie</a> · <a href="#" data-open="privacy" id="p-privacy">Privacy</a></div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
