<!-- The open city, English game (structure as in the live game, Oct 2026; names & numbers made up) -->
<div id="root">
  <button class="city-chip" aria-label="Open city list, Alpha Keep #1234, 3 cities"><img alt=""><span><div class="name">Alpha Keep</div><div class="sub">C12 · 100:200</div></span><svg><path></path></svg></button>
  <button class="res tick" data-tour="res-wood" aria-label="Wood 34630 of 122000, 3300 per hour"><span class="res-top"><img alt=""><span>34.6k</span><span class="res-incoming" role="link"></span></span><div class="bar"><i></i></div><span class="rate"><span class="rate-full">+3.300/h</span><span class="rate-short">+3.3k/h</span></span></button>
  <button class="res tick" data-tour="res-stone" aria-label="Stone 1200 of 122000, 0 per hour"><span class="res-top"><span>1.2k</span></span></button>
  <button class="res tick" data-tour="res-iron" aria-label="Iron 99000 of 122000, 1540 per hour"><span class="res-top"><span>99k</span></span></button>
  <button class="res tick" data-tour="res-food" aria-label="Food 5000 of 122000, -250 per hour"><span class="res-top"><span>5k</span></span></button>
  <button class="res tick" data-tour="res-gold" aria-label="Gold 11488, 2361 per hour"><span class="res-top"><span>11.5k</span></span></button>
  <button class="fab" data-tour="fab-queue" aria-label="Construction queue, 3 orders"><span><svg><circle></circle></svg></span><span class="badge">3</span></button>
  <button class="city-pill bad" aria-label="Buildings 79 of 80"><img alt=""><b class="num">79/80</b></button>
  <div class="sheet">
    <div class="sheet-head"><h2>Construction</h2></div>
    <div class="queue-total">Total <span class="num">2h 15m</span></div>
    <div class="list-item queue-item"><div class="li-title">Farm → 5</div><div class="li-sub">ends in <span class="num">45m</span></div></div>
    <div class="list-item queue-item"><div class="li-title">Cottage → 3</div><div class="li-sub">waiting <span class="num">1h 30m</span></div></div>
    <div class="list-item queue-item"><div class="li-title">Barracks → 2</div><div class="li-sub">waiting <span class="num">5m</span></div></div>
  </div>
  <button class="bb-item" aria-label="Farm"><img src="data:image/png;base64,FARM" alt=""></button>
  <button class="bb-item" aria-label="Bauernhof"><img src="data:image/png;base64,DE" alt=""></button>
  <img alt="Forest" src="data:image/png;base64,FOREST">
</div>
